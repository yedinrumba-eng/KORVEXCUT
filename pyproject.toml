[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kcut"
version = "0.1.0"
description = "Motor determinista de edicion de video de KORVEXCUT"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python>=4.9",
    "Pillow>=12.3",
    "faster-whisper>=1.0",
    "playwright>=1.55.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
kcut = "kcut.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kcut = [
    "assets/fonts/*",
    "gfx/web/*.js",
    "gfx/web/*.css",
    "gfx/web/components/*.js",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "ctranslate2.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 300
markers = [
    "ffmpeg: necesita ffmpeg",
    "chromium: necesita Chromium de Playwright",
    "whisper: necesita el modelo local",
    "flite: necesita el filtro flite",
    "slow: tarda mas de 2 s",
    "e2e: punta a punta",
]
